name: PROD CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: prod-release
  cancel-in-progress: false

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the source code for candidate-api
      - name: Check out the code
        uses: actions/checkout@v4

      # Step 2: Run the test suite before publishing an image
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      # Step 3: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 5: Retrieve and increment prod tag
      - name: Retrieve and Increment Prod Tag
        id: version
        run: |
          git fetch --tags

          # Filter for production tags only (with -prod suffix)
          latest_tag=$(git tag --list '*-prod' | sort -V | tail -n 1)
          if [ -z "$latest_tag" ]; then
            new_tag="1.0.1-prod"
          else
            echo "Latest tag: $latest_tag"

            # Strip "-prod" and split into major.minor.patch
            clean_tag=${latest_tag%-prod}
            IFS='.' read -r major minor patch <<<"${clean_tag}"

            # Increment patch version
            patch=$((patch + 1))

            # Reconstruct new production tag with -prod suffix
            new_tag="$major.$minor.$patch-prod"
          fi

          echo "New tag: $new_tag"
          echo "TAG=$new_tag" >> $GITHUB_ENV

      # Step 6: Build and push Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: softwareaif/candidate-api:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 7: Log out from Docker Hub
      - name: Log out from Docker Hub
        if: always()
        run: docker logout

      # Step 8: Create and push prod git tag
      - name: Create and Push Prod Tag
        run: |
          git tag ${{ env.TAG }}
          git push origin ${{ env.TAG }}
